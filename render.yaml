# Render Blueprint for the Operations Under Pressure backend.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repository. Render reads this
# file, provisions the database, and deploys the API.
#
# After the deploy, set CORS_ORIGINS (marked sync: false below) to the public
# frontend origin (e.g. https://newtonite-ops.vercel.app).
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: newtonite-db
    databaseName: newtonite
    user: newtonite
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: newtonite-ops-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: newtonite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRES_MINUTES
        value: "45"
      - key: IDEMPOTENCY_TTL_HOURS
        value: "24"
      # Set this in the dashboard after the frontend is deployed, for example:
      #   https://newtonite-ops.vercel.app,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false
      # Allow every Vercel deployment origin (production and preview aliases).
      - key: CORS_ORIGIN_REGEX
        value: 'https://.*\.vercel\.app'
