name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: newtonite
          POSTGRES_PASSWORD: newtonite
          POSTGRES_DB: newtonite_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U newtonite -d newtonite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://newtonite:newtonite@localhost:5433/newtonite_test
      TEST_DATABASE_URL: postgresql+psycopg2://newtonite:newtonite@localhost:5433/newtonite_test
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        id: pytest
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Surface pytest output on failure
        if: steps.pytest.outcome != 'success'
        shell: bash
        run: |
          summary=$(tail -n 40 pytest-output.txt | tr '\n' '~' | sed 's/~/ | /g' | sed 's/%/%25/g; s/\r//g')
          echo "::error title=pytest output::${summary:0:1800}"
          exit 1

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
